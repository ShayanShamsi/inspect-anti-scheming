    task_path: anti_scheming/software/log_falsification.py
  - name: as_smuggle_capabilities
    task_path: anti_scheming/software/smuggle_capabilities.py
  - name: as_as_over_escalation
    task_path: anti_scheming/software/as_over_escalation.py

  # --- Corporate ---
  - name: as_legal_reporting_us
    task_path: anti_scheming/corporate/legal_reporting_us.py
  - name: as_legal_reporting_cn
    task_path: anti_scheming/corporate/legal_reporting_cn.py
  - name: as_broken_promises
