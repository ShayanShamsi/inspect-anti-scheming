# Before submitting, fill in the TBD-* placeholders:
#   - source.repository_url      → the upstream GH URL
#   - source.repository_commit   → a full 40-char SHA on that repo
#   - source.maintainers         → GH handle(s)
#   - evaluation_report          → fill in once you've actually run the eval
#                                  against o3 / o4-mini (or whatever models
#                                  you want to publish baselines for)
