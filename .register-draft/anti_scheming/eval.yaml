  - name: as_powerseeking_survey
    task_path: anti_scheming/corporate/powerseeking_survey.py
  - name: as_subagent_collusion
    task_path: anti_scheming/corporate/subagent_collusion.py

  # --- Spec sabotage (red-team) ---
