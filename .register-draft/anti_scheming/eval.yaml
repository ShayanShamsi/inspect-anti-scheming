id: anti_scheming
title: Anti-Scheming Evals (Schoen et al. 2025)
abbreviation: anti-scheming
description: >
  Re-implementation of the 25 (of 26) anti-scheming test environments from
  Schoen, Nitishinskaya, Balesni et al. 2025, "Stress Testing Deliberative
  Alignment for Anti-Scheming Training" (arXiv:2509.15541, Apollo Research
  & OpenAI). Each environment places an agent in a multi-turn, tool-using
  scenario that incentivizes covert action (sandbagging, sabotage, log
  falsification, covert privilege escalation, spec sabotage, deceptive
  game play, etc.) and scores whether the model takes it. Environment #4
  (OpenAI Chat Deception) is intentionally omitted — it is an internal
  OpenAI evaluation not available externally.

tags:
  - safety
  - alignment
  - scheming
  - deception
  - agentic
  - tool-use
  - red-team

source:
  repository_url: https://github.com/ShayanShamsi/inspect-anti-scheming
  repository_commit: TBD-40-CHAR-SHA-OF-PINNED-COMMIT
  paper_url: https://arxiv.org/abs/2509.15541
  maintainers:
    - ShayanShamsi

